syntax = "proto3";

package trading;

import "trading.proto";

option java_package = "com.trading.proto";
option java_outer_classname = "ServicesProto";
option java_multiple_files = true;

// ═══════════════════════════════════════════════════════════
//  EXECUTION SERVICE  (C++ gRPC Server)
//  Receives validated orders, runs the matching engine,
//  and streams back execution results.
// ═══════════════════════════════════════════════════════════

message SubmitOrderRequest {
  Order order = 1;
}

message SubmitOrderResponse {
  string      order_id    = 1;
  OrderStatus status      = 2;
  string      message     = 3;  // Human-readable result or error detail
}

message CancelOrderRequest {
  string order_id = 1;
  string user_id  = 2;
}

message CancelOrderResponse {
  bool   success  = 1;
  string message  = 2;
}

message StreamExecutionsRequest {
  string symbol = 1;  // Filter by symbol, empty = all symbols
}

service ExecutionService {
  // Submit a single order to the matching engine
  rpc SubmitOrder (SubmitOrderRequest) returns (SubmitOrderResponse);

  // Cancel an open order
  rpc CancelOrder (CancelOrderRequest) returns (CancelOrderResponse);

  // Stream all matched trades in real-time
  rpc StreamExecutions (StreamExecutionsRequest) returns (stream Trade);
}

// ═══════════════════════════════════════════════════════════
//  ORCHESTRATOR SERVICE  (Java Spring Boot gRPC Server)
//  Central hub: validates, risk-checks, and routes orders.
//  Called by the Python strategy and user-facing REST API.
// ═══════════════════════════════════════════════════════════

message PlaceOrderRequest {
  Order order = 1;
}

message PlaceOrderResponse {
  string      order_id = 1;
  OrderStatus status   = 2;
  string      message  = 3;
}

message GetPortfolioRequest {
  string user_id = 1;
}

message GetPortfolioResponse {
  Portfolio portfolio = 1;
}

message StreamTradesRequest {
  string user_id = 1;  // Stream trades for a specific user
  string symbol  = 2;  // Optionally filter by symbol
}

service OrchestratorService {
  // Place an order (goes through risk checks before hitting C++ engine)
  rpc PlaceOrder (PlaceOrderRequest) returns (PlaceOrderResponse);

  // Retrieve current portfolio for a user
  rpc GetPortfolio (GetPortfolioRequest) returns (GetPortfolioResponse);

  // Stream live trade confirmations to a user
  rpc StreamTrades (StreamTradesRequest) returns (stream Trade);
}

// ═══════════════════════════════════════════════════════════
//  STRATEGY SERVICE  (Python gRPC Server / Signal Producer)
//  Generates and streams trading signals based on market data.
// ═══════════════════════════════════════════════════════════

message StreamSignalsRequest {
  repeated string symbols   = 1;  // Assets to watch, empty = all
  string          strategy  = 2;  // e.g. "MA_CROSSOVER", "RSI_THRESHOLD"
}

message SubmitSignalRequest {
  Signal signal = 1;
}

message SubmitSignalResponse {
  bool   accepted = 1;
  string order_id = 2;  // Set if the signal triggered an order
  string message  = 3;
}

service StrategyService {
  // Stream signals generated by the Python engine
  rpc StreamSignals (StreamSignalsRequest) returns (stream Signal);

  // Push a single signal to the Java Orchestrator (alternative to streaming)
  rpc SubmitSignal (SubmitSignalRequest) returns (SubmitSignalResponse);
}
