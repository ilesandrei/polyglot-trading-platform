syntax = "proto3";

package trading;

option java_package = "com.trading.proto";
option java_outer_classname = "TradingProto";
option java_multiple_files = true;

// ─────────────────────────────────────────────
//  ENUMS
// ─────────────────────────────────────────────

enum OrderSide {
  ORDER_SIDE_UNSPECIFIED = 0;
  BUY  = 1;
  SELL = 2;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  LIMIT  = 1;
  MARKET = 2;
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  PENDING           = 1;  // Received, not yet validated
  VALIDATED         = 2;  // Passed risk checks, forwarded to C++ engine
  PARTIALLY_FILLED  = 3;  // Some quantity matched
  FILLED            = 4;  // Fully matched
  CANCELLED         = 5;  // Cancelled by user or system
  REJECTED          = 6;  // Failed risk/validation checks
}

enum SignalAction {
  SIGNAL_ACTION_UNSPECIFIED = 0;
  SIGNAL_BUY  = 1;
  SIGNAL_SELL = 2;
  SIGNAL_HOLD = 3;
}

// ─────────────────────────────────────────────
//  CORE MESSAGES
// ─────────────────────────────────────────────

// Represents a user's intent to buy or sell an asset.
message Order {
  string     order_id        = 1;  // UUID, generated by Java Orchestrator
  string     user_id         = 2;  // Reference to the user placing the order
  string     symbol          = 3;  // e.g. "AAPL", "BTC-USD"
  OrderSide  side            = 4;  // BUY or SELL
  OrderType  type            = 5;  // LIMIT or MARKET
  double     quantity        = 6;  // Number of units/shares
  double     price           = 7;  // Limit price (ignored for MARKET orders)
  int64      timestamp_ms    = 8;  // Unix timestamp in milliseconds
  OrderStatus status         = 9;  // Current lifecycle status
}

// Represents a successfully matched trade between two orders.
message Trade {
  string    trade_id        = 1;  // UUID, generated by C++ engine
  string    buy_order_id    = 2;  // The order on the buy side
  string    sell_order_id   = 3;  // The order on the sell side
  string    symbol          = 4;  // Asset that was traded
  double    quantity        = 5;  // How much was traded
  double    price           = 6;  // Price at which the match occurred
  int64     timestamp_ms    = 7;  // Unix timestamp in milliseconds
}

// Represents a trading signal generated by the Python quant strategy.
message Signal {
  string       signal_id       = 1;  // UUID
  string       symbol          = 2;  // Asset the signal applies to
  SignalAction action          = 3;  // BUY, SELL, or HOLD
  string       strategy_name   = 4;  // e.g. "MA_CROSSOVER", "RSI_THRESHOLD"
  double       strength        = 5;  // Confidence score between 0.0 and 1.0
  double       suggested_price = 6;  // Suggested entry price
  double       suggested_qty   = 7;  // Suggested quantity
  int64        timestamp_ms    = 8;  // Unix timestamp in milliseconds
}

// ─────────────────────────────────────────────
//  SUPPORTING MESSAGES
// ─────────────────────────────────────────────

// Portfolio snapshot for a user.
message Portfolio {
  string user_id             = 1;
  double cash                = 2;  // Available cash balance
  repeated Position positions = 3;
}

// A single asset position held by a user.
message Position {
  string symbol       = 1;
  double quantity     = 2;
  double average_cost = 3;  // Average purchase price
  double current_pnl  = 4;  // Unrealised profit/loss
}
